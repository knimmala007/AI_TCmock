<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Real Estate Agent — 118 Cottage Grove Ave</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --brand:#4338ca; --brand-soft:#eef2ff; --ok:#059669; --ok-soft:#ecfdf5;
    --warn:#b45309; --warn-soft:#fffbeb; --bad:#be123c; --bad-soft:#fff1f2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  header.top{background:#0f172a;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header.top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  header.top .tag{font-size:11px;background:#1e293b;color:#94a3b8;padding:3px 8px;border-radius:99px}
  .spacer{flex:1}
  .roles{display:flex;gap:4px;background:#1e293b;padding:4px;border-radius:10px;flex-wrap:wrap}
  .roles button{background:transparent;border:0;color:#94a3b8;padding:6px 13px;border-radius:7px;font:inherit;font-weight:550;cursor:pointer}
  .roles button.on{background:#fff;color:#0f172a}
  .topnav{display:flex;gap:4px}
  .topnav button{background:transparent;border:0;color:#cbd5e1;padding:6px 12px;border-radius:7px;font:inherit;font-weight:550;cursor:pointer}
  .topnav button:hover{background:#1e293b;color:#fff}
  .topnav button.on{background:#1e293b;color:#fff;box-shadow:inset 0 -2px 0 #818cf8}
  /* Dev menu: the testing screens, kept out of the main navigation */
  header.top{position:relative;z-index:20}
  .dev{position:relative}
  .dev summary{list-style:none;cursor:pointer;color:#94a3b8;font-size:12px;font-weight:550;padding:6px 10px;
    border:1px solid #334155;border-radius:7px;user-select:none}
  .dev summary::-webkit-details-marker{display:none}
  .dev summary:hover,.dev[open] summary{color:#fff;border-color:#64748b}
  .dev summary.on{color:#fff;border-color:#818cf8}
  .devmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 30px rgba(15,23,42,.18);padding:6px;min-width:190px;display:flex;flex-direction:column}
  .devmenu button{background:none;border:0;text-align:left;padding:8px 10px;border-radius:7px;font:inherit;color:var(--ink);cursor:pointer}
  .devmenu button:hover{background:var(--brand-soft)}
  .devmenu button.on{font-weight:650;color:var(--brand)}
  .devmenu small{display:block;color:var(--muted);font-size:11.5px}
  .dash-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .dash-title{font-size:22px;margin:0;letter-spacing:-.02em}
  .dashgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
  @media(max-width:900px){.dashgrid{grid-template-columns:1fr}}
  main{max-width:1180px;margin:0 auto;padding:24px 22px 70px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 4px;letter-spacing:-.01em}
  .card h2 .sub{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
  .lede{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
  .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:#f1f5f9;color:var(--muted)}
  .p-brand{background:var(--brand-soft);color:var(--brand)}
  button.act{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
  button.act:hover{background:#3730a3}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:8px;font:inherit;font-weight:550;cursor:pointer}
  button.ghost:hover{border-color:#94a3b8}
  a.pdf{display:inline-block;background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:8px;
    font-weight:550;font-size:12.5px;text-decoration:none;color:var(--ink)}
  a.pdf:hover{border-color:var(--brand);color:var(--brand)}
  .track{display:flex;margin:6px 0 2px}
  .step{flex:1;text-align:center;position:relative}
  .step .dot{width:22px;height:22px;border-radius:99px;background:#fff;border:2px solid var(--line);margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);position:relative;z-index:2}
  .step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .step.now .dot{background:#fff;border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .step .lbl{font-size:11px;color:var(--muted);line-height:1.25;padding:0 4px}
  .step.now .lbl{color:var(--brand);font-weight:650} .step.done .lbl{color:var(--ink)}
  .step:before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
  .step:first-child:before{display:none}
  .step.done:before,.step.now:before{background:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .doccode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--muted)}
  .bar{height:6px;background:#f1f5f9;border-radius:99px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .bar.part>i{background:var(--warn)} .bar.none>i{background:var(--bad)}
  .banner{border-radius:10px;padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;margin-bottom:16px}
  .b-lock{background:#f8fafc;border:1px dashed #cbd5e1;color:var(--muted)}
  .b-warn{background:var(--warn-soft);border:1px solid #fde68a;color:#92400e}
  .b-ok{background:var(--ok-soft);border:1px solid #a7f3d0;color:#065f46}
  .b-info{background:var(--brand-soft);border:1px solid #c7d2fe;color:#3730a3}
  .console{background:#0f172a;border-radius:10px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;color:#cbd5e1;max-height:280px;overflow:auto;margin-top:14px}
  .console .l{padding:2px 0;display:flex;gap:8px}
  .console .t{color:#475569;flex:0 0 46px}
  .console .ok{color:#34d399} .console .fl{color:#fbbf24} .console .hi{color:#a5b4fc}
  .metrics{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .metric{flex:1;min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .metric b{display:block;font-size:20px;letter-spacing:-.02em} .metric span{font-size:11px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .deal-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .deal-hd h3{margin:0 0 3px;font-size:16px;letter-spacing:-.02em}
  .deal-hd .addr{color:var(--muted);font-size:12.5px}
  .note{font-size:11.5px;color:var(--muted);margin-top:10px;font-style:italic}
  .yes{color:var(--ok);font-weight:600} .no{color:var(--bad);font-weight:600}
  select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
  /* ============ DOCUMENT VIEWER ============ */
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:flex-start;
    justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
  .sheet{background:#fff;border-radius:12px;width:100%;max-width:820px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .sheet-h{display:flex;justify-content:space-between;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sheet-h h3{margin:4px 0 3px;font-size:15px;letter-spacing:-.02em}
  .sheet-f{padding:12px 22px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 12px 12px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* the "paper" — deliberately looks like a printed CAR form */
  .paper{padding:0;max-height:64vh;overflow:auto;background:#e9ecef}
  .tabs2{display:flex;gap:6px;align-items:center;padding:9px 22px;border-bottom:1px solid var(--line);
    background:#f8fafc;flex-wrap:wrap}
  .tabs2 button{background:#fff;border:1px solid var(--line);padding:6px 13px;border-radius:8px;font:inherit;
    font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
  .tabs2 button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pdfframe{width:100%;height:64vh;border:0;display:block;background:#e9ecef}
  /* ---- intake agent ---- */
  .pwrap{display:flex;align-items:center;gap:12px}
  .pbar{flex:1;height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden}
  .pbar>i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#059669);
    border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .pnum{font-weight:700;font-size:13px;min-width:38px;text-align:right}
  /* Full-height page: header at its natural height, main fills the rest */
  body{display:flex;flex-direction:column;height:100vh}
  main{flex:1;min-height:0;overflow:auto;width:100%}

  /* Three-column shell (role screens): sidebar · chat · status rail. Each column scrolls on its own. */
  main.shell{max-width:none;margin:0;padding:0;overflow:hidden;
    display:grid;grid-template-columns:260px minmax(0,1fr) 280px}
  .col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .col:last-child{border-right:0}
  .col .scroll{flex:1;overflow-y:auto;padding:16px}
  .col .foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
  .colhd{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
  .side{background:#f1f5f9}
  .hist{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;
    border-radius:8px;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist:hover{background:#e2e8f0}
  .hist.on{background:#fff;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .hist small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
  .side .foot{background:#f1f5f9}
  .side .foot button{text-align:left}
  .side .foot button.on{background:#fff;border-color:var(--brand);color:var(--brand)}
  .choice.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .msg-docs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .doclink{font:600 12px/1 ui-monospace,Menlo,monospace;background:var(--ok-soft);color:var(--ok);
    border:1px solid #a7f3d0;border-radius:6px;padding:5px 8px;cursor:pointer}
  .doclink:hover{background:var(--ok);color:#fff}
  .thread{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.45}
  .msg.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .msg .why{color:var(--muted);font-size:12px;margin-top:4px}
  .msg-note{align-self:flex-end;font-size:11.5px;color:var(--muted);margin-top:-4px}
  .composer{max-width:760px;width:100%;margin:0 auto}
  .composer .choices,.composer .docask{margin-top:0}
  .composer .fillbox{margin-top:0!important}
  .composer .fillbox input{font-size:14px;padding:10px 12px;border-radius:10px}
  /* Live assistant panel: every line is set with textContent, so pre-wrap keeps the author's line breaks. */
  .apchat .msg{white-space:pre-wrap;overflow-wrap:anywhere}
  .apchat .msg.note{align-self:stretch;max-width:none;background:var(--warn-soft);border:1px solid #fde68a;color:#92400e;font-size:13px}
  .apchat .chat-note{max-width:760px;width:100%;margin:0 auto;font-size:12.5px;color:#92400e}
  .apchat .chat-form{max-width:760px;width:100%;margin:0 auto;display:flex;gap:8px}
  .apchat .chat-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
  .vtrack{display:flex;flex-direction:column}
  .vstep{display:flex;gap:10px;position:relative;padding-bottom:22px}
  .vstep:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
  .vstep.done::before{background:var(--ok)}
  .vstep .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:11px;font-weight:700;background:#fff;border:2px solid var(--line);color:var(--muted)}
  .vstep.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
  .vstep.now .dot{border-color:var(--brand);color:var(--brand)}
  .vstep .lbl{padding-top:2px}
  .vstep.now .lbl{font-weight:650}
  .vstep:not(.done):not(.now) .lbl{color:var(--muted)}
  @media (max-width:1000px){ main.shell{grid-template-columns:230px minmax(0,1fr)} .rail{display:none} }
  @media (max-width:680px){ main.shell{grid-template-columns:1fr} .side{display:none} }

  .agentgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.agentgrid{grid-template-columns:1fr}}
  .qcard{background:#fff;border:2px solid var(--brand);border-radius:12px;padding:20px 22px}
  .qgroup{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);font-weight:700}
  .qtext{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:7px 0 6px;line-height:1.35}
  .qwhy{font-size:12.5px;color:var(--muted);line-height:1.5}
  .qfeeds{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
  .choice{background:#fff;border:1px solid var(--line);padding:9px 15px;border-radius:9px;font:inherit;
    font-weight:550;cursor:pointer;text-align:left}
  .choice:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .docask{margin-top:13px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .docask>div{flex:1;min-width:200px;font-size:13px}
  .ogroup{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:14px}
  .ogroup.active{border-left-color:var(--brand)} .ogroup.ok{border-left-color:var(--ok)}
  .ohead{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;
    letter-spacing:.05em;font-weight:700;color:var(--muted);margin-bottom:5px}
  .ogroup.active .ohead{color:var(--brand)} .ogroup.ok .ohead{color:var(--ok)}
  .oitem{display:flex;gap:7px;align-items:baseline;font-size:12px;color:var(--muted);padding:2px 0}
  .oitem.done{color:var(--ink)} .oitem.now{color:var(--brand);font-weight:650}
  .odot{width:11px;flex:0 0 11px;font-size:10px;color:var(--ok)}
  .oitem.now .odot{color:var(--brand)}
  .oval{margin-left:auto;color:var(--ok);font-size:11px;max-width:46%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* ---- visual test runner ---- */
  .labcases{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:12px}
  .labcase{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font:inherit;cursor:pointer;display:block}
  .labcase b{display:block;font-size:12.5px;margin-bottom:3px}
  .labcase span{font-size:11px;color:var(--muted);line-height:1.35;display:block}
  .labcase:hover{border-color:var(--brand)}
  .labcase.on{border-color:var(--brand);border-width:2px;background:var(--brand-soft)}
  .labctl{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .labctl .ghost.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .labstat{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .lst{flex:1;min-width:104px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .lst b{display:block;font-size:19px;letter-spacing:-.02em}
  .lst span{font-size:10.5px;color:var(--muted)}
  .lst.wide{flex:2.2;min-width:210px}
  .narr{max-height:440px;overflow:auto;font-size:12.5px}
  .nline{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f4f6f8}
  .nline:last-child{border-bottom:0}
  .nico{flex:0 0 18px;font-size:13px;line-height:1.3}
  .nn{flex:0 0 26px;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#94a3b8;padding-top:2px}
  .nline b{font-weight:600}
  .ndet{color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.45}
  .n-add b{color:var(--ok)} .n-rm b{color:var(--bad)} .n-doc b{color:var(--brand)}
  .n-warn b{color:var(--warn)} .n-fail b{color:var(--bad)} .n-pass b{color:var(--ok)}
  .n-stat{opacity:.75} .n-stat b{font-weight:500;color:var(--muted)}
  .n-write b{color:#b45309}
  /* ---- a value being written into a form, character by character ---- */
  .val.writing{background:#fef3c7;outline:2px solid var(--warn);outline-offset:1px;
    box-shadow:0 0 0 6px rgba(253,230,138,.4)}
  .caret{display:inline-block;width:2px;height:1em;background:#b45309;margin-left:1px;
    vertical-align:-2px;animation:blink .7s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .val.awaiting{display:inline-block;min-width:150px;background:repeating-linear-gradient(
    -45deg,#f1f5f9,#f1f5f9 5px,#e2e8f0 5px,#e2e8f0 10px);border-bottom:1px dashed #94a3b8;
    outline:1px dashed #cbd5e1;outline-offset:1px}
  @keyframes landed{0%{background:#fde68a;box-shadow:0 0 0 8px rgba(253,230,138,.6)}
                    100%{background:var(--ok-soft);box-shadow:0 0 0 0 rgba(253,230,138,0)}}
  .val.just{animation:landed 2s ease-out}
  /* the open document gets a visible "being worked on" frame during a run */
  .sheet.working{outline:3px solid var(--warn);outline-offset:0}
  .pdffall{padding:14px 22px;font-size:12px;color:var(--muted);background:#fff}
  .page{background:#fff;margin:16px;padding:26px 30px;box-shadow:0 1px 4px rgba(0,0,0,.14);
    font-family:"Times New Roman",Times,Georgia,serif;font-size:12.5px;line-height:1.45;color:#111}
  .car-hd{text-align:center;border-bottom:1.5px solid #111;padding-bottom:7px;margin-bottom:12px}
  .car-hd .org{font-size:9.5px;letter-spacing:.09em;font-weight:700;text-transform:uppercase}
  .car-hd .ttl{font-size:14px;font-weight:700;margin-top:5px;text-transform:uppercase;line-height:1.25}
  .car-hd .rev{font-size:10px;font-style:italic;margin-top:3px;color:#333}
  .sec{margin:14px 0 6px;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1px solid #111;padding-bottom:3px}
  .stat{font-size:11px;color:#333;line-height:1.55;text-align:justify;margin:7px 0}
  .inline{border-bottom:1px solid #111;padding:0 5px;font-family:inherit}
  .val{background:#dcfce7;border-bottom:1px solid #111;padding:1px 6px;font-weight:600}
  .gap{background:#fef3c7;border-bottom:1px dashed #b45309;padding:1px 6px;color:#92400e;font-weight:600;font-style:italic}
  .lbl2{display:inline-block;min-width:0}
  /* checkbox grid — TDS */
  .cbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 14px;margin:8px 0;font-size:11.5px}

/* ---- SPQ: numbered question / Yes-No / explanation ---- */
spq: d => {

/* ==========================================================================
   INTAKE AGENT — one question per fact, never asked twice.
   Every answer propagates to every form that consumes it, and some answers
   change which forms are required at all.
   ========================================================================== */
const BASE_FORMS = ['TDS','SPQ','NHD','AVID','WHSD','WCMD','SBSA','DIA','SA','MCA','FHDA','CCPA',
                    'WFA','SFLS','PSD','SPT','BCA','ABA','EQ','RLA','BK-ENV','BK-NRG','BK-EQ','BK-SIG','BK-MOLD'];

const INTAKE = { answers:{}, log:[], done:false };
const ans = k => INTAKE.answers[k];
const ansV = k => ans(k) ? ans(k).v : null;

/* Each entry is asked AT MOST ONCE and feeds every form listed in `fills`. */
const QUESTIONS = [
 // ---------- parties & property
 {k:'sellerType', g:'Parties & Property', q:'How is the seller taking title?', type:'choice',
  options:['Individual(s)','Corporation or LLC','Trust','Estate'],
  why:'Decides whether representative-capacity and FIRPTA substitute forms are required at all.',
  fills:['TDS','SPQ','RLA'],
  adds:v=> (v==='Corporation or LLC'||v==='Trust'||v==='Estate') ? ['RCSD-S','QS','AS'] : ['AS']},
 {k:'seller', g:'Parties & Property', q:'Full legal name of the seller, exactly as it will appear on the deed.',
  type:'text', ph:'e.g. Seller Corp.',
  why:'Appears on every seller-signed form in the package.',
  fills:['TDS','SPQ','NHD','LPD','WHSD','SJ-TREE','DIA','SA','BCA','RCSD-S','AS','QS','RLA']},
 {k:'signer', g:'Parties & Property', q:'Who signs on behalf of the entity, and in what capacity?',
  type:'text', ph:'e.g. Authorized Officer, President',
  why:'Required on the representative-capacity disclosure.',
  asks:()=> ['Corporation or LLC','Trust','Estate'].includes(ansV('sellerType')),
  fills:['RCSD-S','QS']},
 {k:'address', g:'Parties & Property', q:'Property street address.', type:'text',
  ph:'e.g. 118 Cottage Grove Avenue',
  why:'Appears on every form in the package.',
  fills:['TDS','SPQ','NHD','AVID','LPD','WHSD','WCMD','SJ-TREE','SFLS','PSD','EQ','RLA','PTR','PROP']},
 {k:'city', g:'Parties & Property', q:'Which city is the property in?', type:'choice',
  options:['San José','San Francisco','Los Angeles','Berkeley','Oakland','Other / unincorporated'],
  why:'This is the single answer that decides the local-ordinance forms. Getting it wrong is how packages fail.',
  fills:['TDS','AVID','NHD'],
  derives:v=>({county:{'San José':'Santa Clara','San Francisco':'San Francisco','Los Angeles':'Los Angeles',
                       'Berkeley':'Alameda','Oakland':'Alameda'}[v]||null}),
  adds:v=> v==='San José'?['SJ-TREE','SMSCA'] : v==='San Francisco'?['SF-3R','SF-EWC']
        : v==='Los Angeles'?['LA-9A','LA-RETRO','LA-GAS'] : v==='Berkeley'?['BK-RECO','BK-SEWER']
        : v==='Oakland'?['OK-RECO','EBMUD'] : []},
 {k:'county', g:'Parties & Property', q:'County?', type:'text',
  why:'Statutory forms name the county.', fills:['TDS','NHD','AVID'],
  asks:()=> !ansV('county')},
 {k:'apn', g:'Parties & Property', q:'Assessor Parcel Number.', type:'text', ph:'e.g. 434-24-002',
  why:'Keys the title report, the hazard report and the county records.',
  fills:['NHD','SJ-TREE','PTR','PROP','LA-9A','SF-3R']},
 {k:'yearBuilt', g:'Parties & Property', q:'Year the dwelling was built.', type:'text', ph:'e.g. 1947',
  why:'Anything before 1978 triggers the federal lead-paint disclosure and booklet. If the year cannot be '
     + 'established, the disclosure is required anyway — the safe default is to assume pre-1978, never to skip it.',
  fills:['TDS','SPQ'],
  // Unparseable or unknown year => assume pre-1978 and require the disclosure.
  adds:v=>{ const y=parseInt(v,10); return (!Number.isFinite(y) || y<1978) ? ['LPD','BK-LEAD'] : []; }},
 {k:'propertyType', g:'Parties & Property', q:'Property type?', type:'choice',
  options:['Single-family resale','Condominium','Townhome','New construction'],
  why:'Common-interest developments pull in the full HOA document set.',
  fills:['TDS','RLA'],
  adds:v=> (v==='Condominium'||v==='Townhome')?['HOA','HOA-CERT'] : v==='New construction'?['NEWCON'] : []},
 {k:'pool', g:'Parties & Property', q:'Is there a swimming pool or spa on the property?', type:'choice',
  options:['No','Yes — pool only','Yes — spa only','Yes — pool and spa'],
  why:'SB 442 amended Health & Safety Code §115922: when a property with a pool or spa transfers, the home '
     + 'inspection must identify which of the seven drowning-prevention safety features are present and state '
     + 'explicitly if fewer than two are. Missing this is a liability event, not a paperwork slip.',
  fills:['TDS','SPQ'],
  adds:v=> v.startsWith('Yes') ? ['POOL'] : []},

/* ---- engine ---- */
function requiredForms(){
  const set = new Set(BASE_FORMS);
  QUESTIONS.forEach(q=>{ const a=ans(q.k); if(a && q.adds) q.adds(a.v).forEach(c=>set.add(c)); });
  return [...set];
}
function askable(q){ return q.asks ? !!q.asks() : true; }
function pending(){ return QUESTIONS.filter(q=> !ans(q.k) && askable(q)); }
function nextQ(){ return pending()[0] || null; }

/* A form is ready when every askable question that feeds it has been answered. */
function formFields(code){ return QUESTIONS.filter(q=>(q.fills||[]).includes(code) && askable(q)); }
function formReady(code){ const f=formFields(code); return f.length===0 || f.every(q=>ans(q.k)); }
function intakeProgress(){
  const forms = requiredForms();
  const ready = forms.filter(formReady).length;
  // Progress is measured only against forms that actually carry data. Fixed-text
  // advisories and booklets are "ready" the moment they are attached, so counting
  // them would show ~40% before a single question is answered.
  const dataForms = forms.filter(c=>formFields(c).length>0);
  const dataReady = dataForms.filter(formReady).length;
  const qs = QUESTIONS.filter(askable);
  const answered = qs.filter(q=>ans(q.k)).length;
  return {forms, ready, dataForms, dataReady, answered, total:qs.length,
          pct: dataForms.length ? Math.round(dataReady/dataForms.length*100) : 0};
}

/* --------------------------------------------------------------------------
   The interview is not a separate toy. Every answer is written straight through
   to the transaction file that the Broker, Seller, Buyer, Files and document
   views read from, so the package fills as the questions get answered.
   -------------------------------------------------------------------------- */
const INTAKE_TO_DEAL = {
  seller:'seller', address:'address', county:'county', apn:'apn', repairs:'repairs',
  listingAgent:'listingAgent', permitHistory:'permitHistory', defects:'condition',
  occupancy:'tenancyStatus', waterHeater:'waterHeater', smokeAlarm:'smokeAlarm',
  treeStatus:'treeStatus', escrow:'escrowCo', claims:'insuranceClaims', pool:'pool', solar:'solar',
};
function applyIntakeToDeal(){
  if(!Object.keys(INTAKE.answers).length) return;
  Object.entries(INTAKE_TO_DEAL).forEach(([ik,dk])=>{
    const a = ans(ik); if(a) DEAL.data[dk] = {v:a.v, src:a.src};
  });
  // one uploaded hazard report resolves all six statutory answers
  if(ans('hazards')){
    const s = ans('hazards').src==='Uploaded document' ? 'NHD vendor report' : ans('hazards').v;
    [['floodZone','No'],['damFlood','Yes'],['fireZone','No'],['wildland','No'],
     ['faultZone','No'],['seismicZone','Yes — Liquefaction Zone']]
      .forEach(([k,v])=>{ DEAL.data[k] = {v, src:s}; });
  }
  // top-level property identity drives every header in the app
  if(ansV('address'))  DEAL.address = ansV('address');
  if(ansV('city'))     DEAL.city    = ansV('city');
  if(ansV('county'))   DEAL.county  = ansV('county');
  if(ansV('apn'))      DEAL.apn     = ansV('apn');
  if(ansV('seller'))   DEAL.seller  = ansV('seller');
  if(ansV('listingAgent')) DEAL.listingAgent = ansV('listingAgent');
  if(ansV('yearBuilt') && parseInt(ansV('yearBuilt'),10)) DEAL.yearBuilt = parseInt(ansV('yearBuilt'),10);
  if(ansV('propertyType')) DEAL.type = ansV('propertyType');
  // no question asks for form dates: they carry the date this package was prepared
  const today = new Date().toISOString().slice(0,10);
  ['tdsDate','lpdDate','nhdDate','glideDate','treeDate'].forEach(k=>{ if(!DEAL[k]) DEAL[k] = today; });
  if(!fieldVal('lpdDate')) DEAL.data.lpdDate = {v:fmtD(today), src:'Date package prepared'};
  DEAL.tcRun = true;
}

/* The live package = whatever the rules engine currently requires. */
function activeDocs(){
  return Object.keys(INTAKE.answers).length
    ? requiredForms().map(docByCode)
    : DOCS;
}

window.answerQ = function(k, forced){
  const q = QUESTIONS.find(x=>x.k===k); if(!q) return;
  let v = forced;
  if(v===undefined){ const el=$('#in-'+k); v = el ? el.value.trim() : ''; }
  if(!v) return;
  const before = requiredForms();
  INTAKE.answers[k] = {v, src: q.type==='doc' ? 'Uploaded document' : 'Broker intake'};
  // An answer can auto-populate other fields without asking. These must be RECOMPUTED
  // on re-answer, or a deal moved from San José to Los Angeles keeps Santa Clara County
  // printed on its statutory forms. Values the user typed are never clobbered — only
  // previously derived ones.
  if(q.derives) Object.entries(q.derives(v)).forEach(([dk,dv])=>{
    const cur = ans(dk), wasDerived = cur && /^Derived/.test(cur.src);
    if(dv && (!cur || wasDerived)) INTAKE.answers[dk] = {v:dv, src:'Derived from '+q.g.toLowerCase()};
    else if(!dv && wasDerived){ delete INTAKE.answers[dk]; delete DEAL.data[dk]; }
  });
  const added = requiredForms().filter(c=>!before.includes(c));
  const filled = (q.fills||[]).filter(c=>requiredForms().includes(c));
  INTAKE.log.push({k, q:q.q, v, filled, added, skippedNow:
    QUESTIONS.filter(x=>!ans(x.k) && !askable(x) && x.g===q.g).map(x=>x.k)});
  applyIntakeToDeal();
  if(!nextQ()) INTAKE.done = true;
  render();
};
window.resetIntake = ()=>{ INTAKE.answers={}; INTAKE.log=[]; INTAKE.done=false; blankDeal(); activeCase=null; render(); };
window.prefillIntake = ()=>{  // load the known Cottage Grove facts to jump ahead
  [['sellerType','Corporation or LLC'],['seller','Seller Corp.'],['signer','Authorized Officer, President'],
   ['address','118 Cottage Grove Avenue'],['city','San José'],['apn','434-24-002'],['yearBuilt','1947'],
   ['propertyType','Single-family resale']].forEach(([k,v])=>answerQ(k,v));
};

// The answer control for one question — shared by the Agent card and the chat composer.
function qInput(q){
  if(q.type==='choice'){
    return `<div class="choices">${q.options.map(o=>
      `<button class="choice" onclick="answerQ('${q.k}',${JSON.stringify(o).replace(/"/g,'&quot;')})">${o}</button>`).join('')}</div>`;
  }
  if(q.type==='doc'){
    return `<div class="docask">
      <div><b>${q.docLabel}</b><div class="src">Supplies in one step: ${q.supplies.join(' · ')}</div></div>
      <button class="act" onclick="answerQ('${q.k}','Received — ${q.supplies.length} values extracted')">Upload / mark received</button>
      <button class="ghost" onclick="answerQ('${q.k}','Ordered — pending vendor')">Order it</button>
    </div>`;
  }
  return `<div class="fillbox" style="margin-top:10px">
    <input id="in-${q.k}" placeholder="${esc(q.ph||'')}" onkeydown="if(event.key==='Enter')answerQ('${q.k}')">
    <button class="act" onclick="answerQ('${q.k}')">Save</button></div>`;
}

function agentView(){
  const p = intakeProgress(), q = nextQ();
  const groups = [...new Set(QUESTIONS.filter(askable).map(x=>x.g))];

  const outline = groups.map(g=>{
    const qs = QUESTIONS.filter(x=>x.g===g && askable(x));
    const done = qs.filter(x=>ans(x.k)).length;
    const active = q && q.g===g;
    return `<div class="ogroup ${active?'active':''} ${done===qs.length?'ok':''}">
      <div class="ohead"><span>${g}</span><span class="doccode">${done}/${qs.length}</span></div>
      ${qs.map(x=>`<div class="oitem ${ans(x.k)?'done':(q&&q.k===x.k?'now':'')}">
        <span class="odot">${ans(x.k)?'✓':(q&&q.k===x.k?'▸':'')}</span>
        <span>${FIELDS[x.k]||x.k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())}</span>
        ${ans(x.k)?`<span class="oval">${esc(ans(x.k).v)}</span>`:''}</div>`).join('')}
    </div>`;}).join('');

  const last = INTAKE.log[INTAKE.log.length-1];
  const receipt = last ? `<div class="banner b-ok" style="margin:0 0 14px">✓ <div>
      <b>“${esc(last.v)}”</b> recorded — filled <b>${last.filled.length} form${last.filled.length===1?'':'s'}</b>
      (${last.filled.join(', ')||'—'}) without asking again.
      ${last.added.length?` <b>+${last.added.length} form(s) added</b> because of this answer: ${last.added.join(', ')}.`:''}
    </div></div>` : '';

  let card;
  if(!q){
    card = `<div class="banner b-ok">✓ <div><b>Conversation complete.</b> Every fact the package needs has been
      collected. ${p.ready} of ${p.forms.length} forms are ready.</div></div>
      <button class="act" onclick="resetIntake()">Start over</button>`;
  } else {
    const feeds = (q.fills||[]).filter(c=>p.forms.includes(c));
    const input = qInput(q);
    card = `<div class="qcard">
      <div class="qgroup">${q.g} · question ${p.answered+1} of ${p.total}</div>
      <div class="qtext">${q.q}</div>
      <div class="qwhy">${q.why}</div>
      ${input}
      <div class="qfeeds">This answer will fill <b>${feeds.length}</b> form${feeds.length===1?'':'s'}:
        <span class="doccode">${feeds.join(', ')||'—'}</span></div>
    </div>`;
  }

  const notReady = p.forms.filter(c=>!formReady(c));
  return `<div class="card">
      <h2>Intake agent <span class="sub">asks once, fills everywhere</span></h2>
      <p class="lede">One question per fact. Nothing is asked twice, nothing irrelevant is asked at all, and the
        form set changes as you answer.</p>
      <div class="pwrap"><div class="pbar"><i style="width:${p.pct}%"></i></div>
        <div class="pnum">${p.pct}%</div></div>
      <div class="metrics" style="margin-top:12px">
        <div class="metric"><b>${p.answered}/${p.total}</b><span>Questions answered</span></div>
        <div class="metric"><b>${p.dataReady}/${p.dataForms.length}</b><span>Data-bearing forms complete</span></div>
        <div class="metric"><b>${p.forms.length - BASE_FORMS.length}</b><span>Forms added by your answers</span></div>
        <div class="metric"><b>${QUESTIONS.filter(x=>!askable(x)).length}</b><span>Questions skipped as irrelevant</span></div>
      </div>
      ${INTAKE.log.length?'':`<div style="margin-top:14px"><button class="ghost" onclick="prefillIntake()">
        Jump ahead — load the known Cottage Grove facts</button></div>`}
    </div>
    ${receipt}
    <div class="agentgrid">
      <div>${card}
        ${notReady.length?`<div class="card" style="margin-top:16px"><h2>Still blocking ${notReady.length} form(s)</h2>
          <p class="lede">Each of these is waiting on a question above — not on separate data entry.</p>
          ${notReady.slice(0,10).map(c=>{
            const miss=formFields(c).filter(x=>!ans(x.k));
            return `<div class="kv"><span class="doccode">${c}</span>
              <span style="font-size:12px">${miss.map(m=>m.g+': '+m.q.slice(0,42)+'…').slice(0,1)}</span></div>`;
          }).join('')}
          ${notReady.length>10?`<p class="note">+${notReady.length-10} more</p>`:''}</div>`:''}
      </div>
      <div class="card"><h2>Conversation outline</h2>
        <p class="lede">Sorted so the answers that unblock the most forms come first.</p>
        ${outline}</div>
    </div>`;
}

  RUN.log.push({kind, text, detail, n:++RUN.stepNo});
  if(RUN.log.length>140) RUN.log.shift();
}
function snapshot(){
  const p=intakeProgress();
  return {pct:p.pct, forms:requiredForms().length, ready:p.dataReady, total:p.dataForms.length,
          answered:p.answered, gaps:missingFields().length};
}

window.labSelect = i=>{ labStop(); RUN.caseIdx=i; labReset(); };
window.labReset  = ()=>{ resetIntake(); RUN.phase='idle'; RUN.log=[]; RUN.results=[]; RUN.stepNo=0;
                         RUN.flash.clear(); RUN.q=null; RUN.epi=0; RUN.typing=null; RUN.queue=[];
                         RUN.pending.clear(); RUN.seen.clear(); closeDoc(); render(); };
window.labStop   = ()=>{ RUN.playing=false; if(RUN.timer){clearTimeout(RUN.timer);RUN.timer=null;} };
window.labPlay   = ()=>{ if(RUN.playing) return labPause();
  RUN.playing=true; if(RUN.phase==='idle') RUN.phase='ask'; render(); labLoop(); };
window.labPause  = ()=>{ labStop(); render(); };
window.labStep   = ()=>{ labStop(); if(RUN.phase==='idle') RUN.phase='ask'; labFrame(); };
window.labSpeed  = k=>{ RUN.sp=k; render(); };

function labLoop(){
  if(!RUN.playing) return;
  const wait = labFrame();
  if(RUN.phase==='done'){ labStop(); return; }
  RUN.timer = setTimeout(labLoop, wait);
}

/* One unit of work. Returns how long to wait before the next unit, so a single
   character of typing costs ~50ms while a whole question costs a couple of seconds. */
function labFrame(){
  const C = CASES[RUN.caseIdx], S = SP();
  try{
    // ---- 1. a value is mid-way through being written into an open form
    if(RUN.typing){
      const t = RUN.typing;
      t.pos += RUN.instant ? t.full.length : 1;
      if(t.pos >= t.full.length){
        t.pos = t.full.length;
        RUN.pending.delete(t.field);
        RUN.seen.add(t.field);
        RUN.typing = null;
        paintDoc();
        return RUN.instant ? 0 : S.field;          // pause on the completed field
      }
      paintDoc();                                   // repaint only the document
      return RUN.instant ? 0 : S.char;
    }
    // ---- 2. more fields queued for this document
    if(RUN.queue.length){
      const f = RUN.queue.shift(), val = fieldVal(f);
      RUN.typing = {field:f, full:String(val ? val.v : ''), pos:0};
      narrate('write', `Writing “${FIELDS[f]||f}” into ${RUN.spot}`,
        `${String(val?val.v:'')}  —  source: ${val?val.src:'—'}`);
      paintDoc();
      return RUN.instant ? 0 : Math.round(S.char*3);
    }
    // ---- 3. document finished filling
    if(RUN.phase==='typing'){
      const d = docByCode(RUN.spot), st = docState(d);
      narrate('doc', `${RUN.spot} now ${st.pct}% filled`,
        `Status “${st.status.replace('_',' ')}”${st.gaps.length
          ? ` — still waiting on ${st.gaps.map(g=>FIELDS[g]||g).join(', ')}` : ' — ready to send'}.`);
      RUN.phase = 'close';
      return RUN.instant ? 0 : S.read;
    }
    if(RUN.phase==='close'){ closeDoc(); RUN.flash.clear(); RUN.phase='ask'; render(); return RUN.instant?0:S.step/2; }

    // ---- 4. next question
    if(RUN.phase==='ask'){
      const q = nextQ();
      if(!q){
        if(C.epilogue && RUN.epi < C.epilogue.length){
          const [k,v] = C.epilogue[RUN.epi++];
          narrate('warn','Broker corrects an earlier answer',
            `Changing “${FIELDS[k]||k}” to “${v}”. The package must re-derive, not merely append.`);
          RUN.q = {k, epi:true, g:'Correction'}; RUN.phase='answer'; render();
          return RUN.instant?0:S.read;
        }
        RUN.phase='done'; labFinish(); return 0;
      }
      RUN.q=q; view='agent';
      narrate('ask', `Agent asks — ${q.g}`, q.q);
      RUN.phase='answer';                       // <- without this the runner re-asks forever
      render();
      return RUN.instant?0:S.read;
    }
    // ---- 5. answer it, then open the affected document and start writing
    if(RUN.phase==='answer'){
      const q=RUN.q, v = q.epi ? C.epilogue[RUN.epi-1][1] : C.a[q.k];
      const before = requiredForms();
      answerQ(q.k, v);
      const after = requiredForms();
      const added   = after.filter(c=>!before.includes(c));
      const removed = before.filter(c=>!after.includes(c));
      const filled  = (QUESTIONS.find(x=>x.k===q.k)?.fills||[]).filter(c=>after.includes(c));
      const s = snapshot();
      narrate('answer', `Broker answers: “${v}”`, `Feeds ${filled.length} form(s): ${filled.join(', ')||'—'}`);
      if(added.length)   narrate('add', `+${added.length} form(s) now required`, added.join(', '));
      if(removed.length) narrate('rm',  `−${removed.length} form(s) no longer required`, removed.join(', '));
      narrate('stat','Package status', `${s.answered} answered · ${s.forms} forms · `
        + `${s.ready}/${s.total} data forms ready · ${s.gaps} field(s) outstanding · ${s.pct}%`);

      const spot = SPOT[q.k];
      if(spot && after.includes(spot)){
        // queue every field on this form that now has a value but has not been shown yet
        const d = docByCode(spot);
        const q2 = (d.fields||[]).filter(f=>fieldVal(f) && !RUN.seen.has(f));
        if(q2.length){
          RUN.spot=spot; RUN.queue=q2; RUN.pending=new Set(q2);
          view='broker'; openDoc(spot);
          narrate('doc', `Opening ${spot}`,
            `${d.name} — writing ${q2.length} field(s) in, one at a time.`);
          RUN.phase='typing'; render();
          return RUN.instant?0:S.read;
        }
      }
      RUN.phase='ask'; render();
      return RUN.instant?0:S.step;
    }
  }catch(e){ narrate('fail','Runner error', e.message); labStop(); RUN.phase='done'; render(); }
  return S.step;
}

function labFinish(){
  labStop();
  const C=CASES[RUN.caseIdx];
  RUN.results = C.expect.map(([label,fn])=>{ let p=false; try{p=!!fn();}catch(e){p=false;} return {label,p}; });
  const bad=RUN.results.filter(r=>!r.p).length;
  narrate(bad?'fail':'pass', bad?`${bad} assertion(s) FAILED`:`All ${RUN.results.length} assertions passed`,
    `${requiredForms().length} forms in the final package · ${intakeProgress().pct}% complete`);
  view='broker'; render();
}
/* Runs every case with the animation switched off — for checking results, not watching. */
window.labRunAll = ()=>{
  labStop(); RUN.instant=true;
  const summary=[];
  for(let i=0;i<CASES.length;i++){
    RUN.caseIdx=i; labReset(); RUN.phase='ask';
    let guard=0; while(RUN.phase!=='done' && guard++<4000) labFrame();
    const bad=RUN.results.filter(r=>!r.p).length;
    summary.push(`${i+1}. ${CASES[i].title} — ${bad?bad+' FAILED':'all '+RUN.results.length+' passed'}`);
  }
  RUN.instant=false;
  narrate('pass','Batch complete', summary.join('  ·  '));
  render();
};

/* Backend wiring (ticket 063). Demo mode, no sign-in: the role switcher asks the server to start a
   session for a role, and the server answers with an HttpOnly cookie that this page cannot read.
   /api/agent gets only {message}; the server takes the role from that cookie. The panel belongs to
   one role: a switch empties it, and Send stays off until the switch has succeeded. Every string
   shown in the panel is set with textContent, and anything but a 200 reply is one of the fixed
   messages below, never a response body. */
const DEMO_ROLES = ['broker','seller','buyer','lender'];
const CHAT_INTRO = 'Ask the assistant about this transaction.';
const CHAT_NOTE = {
  pending: 'Starting a session for this role…',
  nosession: 'Could not start a session for this role. Pick the role again to retry.',
  unreachable: 'Could not reach the assistant. Please try again.',
  401: 'Pick a role first.',
  403: 'This role is not allowed to do that.',
  429: 'You are sending messages too quickly. Please wait a minute and try again.',
  503: 'The assistant is not available right now. Please try again later.',
  other: 'Something went wrong. Please try again.',
};
// state: 'pending' (switch in flight) | 'ready' (session set for CHAT.role) | 'failed' (Send stays off)
let CHAT = {role:null, msgs:[], busy:false, gen:0, state:'pending', note:CHAT_NOTE.pending};

async function syncDemoRole(r){
  if(!DEMO_ROLES.includes(r)) return false;
  try{
    const res = await fetch('/api/demo-session',{method:'POST',headers:{'content-type':'application/json'},
      credentials:'same-origin',body:JSON.stringify({role:r})});
    return res.ok;
  }catch(e){ return false; }
}
// Start a clean panel for role r, then ask the server for its session. The old thread is never reused.
async function switchChatRole(r){
  CHAT = {role:r, msgs:[], busy:false, gen:CHAT.gen+1, state:'pending', note:CHAT_NOTE.pending};
  const gen = CHAT.gen;   // the caller (render) paints the empty panel
  const ok = await syncDemoRole(r);
  if(CHAT.gen!==gen) return;   // the role changed again while waiting
  CHAT.state = ok ? 'ready' : 'failed';
  CHAT.note = ok ? '' : CHAT_NOTE.nosession;
  renderChat();
}
function chatLine(status, body){
  if(status===200 && body && typeof body.reply==='string') return {who:'agent', text:body.reply};
  return {who:'note', text: CHAT_NOTE[status] || CHAT_NOTE.other};
}
function renderChat(){
  const log = $('#chat-log'); if(!log) return;
  const live = CHAT.role===role;   // never paint another role's thread
  const msgs = live ? CHAT.msgs : [];
  const state = live ? CHAT.state : 'pending';
  const line = (cls, text)=>{ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=text; return d; };
  log.replaceChildren(...(msgs.length
    ? msgs.map(m=>line(m.who==='you'?'me':m.who==='agent'?'bot':'note', m.text))
    : [line('bot', CHAT_INTRO)]));
  const note = $('#chat-note'); note.textContent = state==='ready' ? '' : (live ? CHAT.note : CHAT_NOTE.pending);
  note.hidden = !note.textContent;
  const off = state!=='ready' || CHAT.busy;
  $('#chat-send').disabled = off; $('#chat-in').disabled = state!=='ready';
  const s = $('#chatScroll'); if(s) s.scrollTop = s.scrollHeight;
}
async function chatSend(text){
  const c = CHAT;
  if(!text || c.role!==role || c.state!=='ready' || c.busy) return;
  const gen = c.gen;
  c.busy = true; c.msgs.push({who:'you', text}); renderChat();
  let line;
  try{
    const r = await fetch('/api/agent',{method:'POST',headers:{'content-type':'application/json'},
      credentials:'same-origin',body:JSON.stringify({message:text})});
    const body = await r.json().catch(()=>null);
    line = chatLine(r.status, body);
    if(r.status===401 && CHAT.gen===gen){ c.state = 'failed'; c.note = CHAT_NOTE[401]; }   // cookie gone: re-pick the role
  }catch(e){ line = {who:'note', text:CHAT_NOTE.unreachable}; }
  if(CHAT.gen!==gen) return;   // the role changed while waiting: this reply belongs to the old session
  c.busy = false; c.msgs.push(line); renderChat();
}
window.sendChat = ()=>{
  const box = $('#chat-in'); const text = String(box.value||'').trim();
  if(!text || CHAT.busy) return;
  box.value = ''; chatSend(text);
};

}
// (render() starts the demo session whenever the role differs from the chat panel's role.)
window.setView = v=>{ view=v; if(ROLE_VIEWS.includes(v)){ role=v; if(CHAT.state==='failed') CHAT.role=null; } render(); };
// Switching role keeps you on the Dashboard if you're there; otherwise it opens that role's chat.
// Picking the role again after a failed switch retries it.
window.pickRole = r=>{ role=r; if(CHAT.state==='failed') CHAT.role=null; if(view!=='dashboard') view=r; render(); };
// From the Dashboard: jump into the chat screen with a given middle panel (chat, messages, workflow…)
window.goShell = c=>{ view=role; center=c; render(); };
// (A function, not onclick="setView(role)": inside an onclick, `role` means the button's own ARIA role.)
window.openChat = ()=>setView(role);
// close the Dev menu when clicking anywhere else
document.addEventListener('click', e=>{ const d=$('#dev'); if(d && d.open && !d.contains(e.target)) d.open=false; });

function progressBar(stages,idx){
  return `<div class="track">${stages.map((s,i)=>{
    const c=i<idx?'done':(i===idx?'now':'');
    return `<div class="step ${c}"><div class="dot">${i<idx?'✓':i+1}</div><div class="lbl">${s}</div></div>`;
  }).join('')}</div>`;
}

window.openDoc = code=>{

function paintDoc(){
  if(!openRef)return;
  const d=docByCode(openRef), s=docState(d), hasPdf=HAS_PDF.has(d.code);
  const map={ready:['p-ok','Ready to send'],flagged:['p-warn','Incomplete — held'],not_started:['p-idle','Not started']};
  const [pc,pl]=map[s.status];
  const gapFill = s.gaps.length? `<div class="card" style="margin:16px;border-color:#fcd34d;background:var(--warn-soft)">
      <h2>Resolve outstanding fields</h2>

        <div class="fillbox"><input id="fill-${g}" placeholder="Enter ${esc(FIELDS[g]||g)}…">
        <button class="act" style="padding:6px 12px" onclick="saveField('${g}')">Save</button></div></div>`).join('')}
    </div>`:'';
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeDoc()">
    <div class="sheet">
      <div class="sheet-h">
        <div><div class="doccode">${d.code} · ${d.src}</div><h3>${d.name}</h3>
          <div class="addr" style="color:var(--muted);font-size:12px">${d.form}</div></div>
        <div style="text-align:right"><span class="pill ${pc}">${pl}</span>
          <div class="doccode" style="margin:6px 0">${s.pct}% filled</div>
          <button class="ghost" onclick="closeDoc()">Close</button></div>
      </div>
      <div class="tabs2">
        <button id="tab-pdf" class="${hasPdf?'on':''}" onclick="docTab('pdf')">📄 Signed original</button>
        <button id="tab-live" class="${hasPdf?'':'on'}" onclick="docTab('live')">✎ Interactive form</button>
        <span class="spacer"></span>
        ${hasPdf?`<a class="pdf" href="${pdfPath(d.code)}" target="_blank">Open in new tab ↗</a>
        <a class="pdf" href="${pdfPath(d.code)}" download="${d.code}.pdf">Download</a>`:''}
      </div>
      <div class="paper" id="pane-pdf" style="display:${hasPdf?'':'none'}">
        ${hasPdf?`<embed src="${pdfPath(d.code)}#toolbar=1&navpanes=0" type="application/pdf" class="pdfframe">
        <div class="pdffall">This is the <b>executed document from the real transaction</b>, stored in this app at
          <code>${pdfPath(d.code)}</code>. If it does not render above, your browser is blocking inline PDFs for
          local files — use <b>Open in new tab</b>.</div>`
        :`<div class="pdffall" style="padding:26px 22px"><b>No executed original on file.</b><br>
          The rules engine requires this form for this transaction, but the Cottage Grove package did not contain
          one, so there is nothing signed to show. Use the interactive form to capture the data; the executed PDF
          gets attached when the deal produces one.</div>`}
      </div>
      <div class="paper" id="pane-live" style="display:${hasPdf?'none':''}"><div class="page">${RENDER[d.render](d)}</div>${gapFill}</div>
      <div class="sheet-f">
        <span class="pill ${hasPdf?'p-ok':'p-warn'}">${hasPdf?'Executed original · app storage':'No signed original yet'}</span>
        <span class="note" style="font-style:normal">${s.gaps.length
          ? `${s.gaps.length} field(s) outstanding — switch to the interactive form to fill them.`
          : hasPdf ? 'The real signed document, served from this app’s own store. No Google Drive.'
                   : 'Data captured, awaiting an executed copy.'}</span>
      </div>
    </div></div>`;
}

let activeCase = null;   // which sample deal is loaded in the chat (null = your own deal)

// Load a sample deal from the Test Lab into the chat by answering its questions automatically.
// The app holds one deal at a time, so this replaces whatever was in the chat.
window.loadCase = id=>{
  const C = CASES.find(c=>c.id===id);
  resetIntake();
  let q, guard=0;
  while((q = nextQ()) && C.a[q.k]!==undefined && guard++<500) answerQ(q.k, C.a[q.k]);
  activeCase = id;
  THREADS.forEach(t=>t.msgs=[]);   // a different deal has its own conversations
  goShell('chat');                 // works from the Dashboard too, not just the chat screen
};

function transactionsView(v){
  const p = intakeProgress(), [stages, idx] = stagesFor(v);

  // the deal that's open in the chat right now
  const current = `<tr>
      <td><div><b>${esc(DEAL.address || 'New transaction')}</b></div>
          <div class="doccode">${activeCase ? 'Sample case' : 'Your deal'} · open now</div></td>
      <td>${stages[idx]}</td>

    </tr>`;

  // one row per Test Lab sample deal — broker only; seller and buyer see just their own deal
  const samples = v.role!=='broker' ? [] : CASES
    .filter(c=>c.id!==activeCase)

/* ---------- Messages screen ---------- */
// One thread per party. `sides` = which roles may see it (same isolation as the documents);
// `name` = what each side calls the other person.
const THREADS = [
  {id:'agent',  sides:['broker','seller','buyer','lender'],
   name:{broker:'AI coordinator', seller:'AI coordinator', buyer:'AI coordinator', lender:'AI coordinator'}, msgs:[]},
  {id:'seller', sides:['broker','seller'], name:{broker:'Seller', seller:'Listing agent'}, msgs:[]},
  {id:'buyer',  sides:['broker','buyer'],  name:{broker:"Buyer's agent", buyer:'Listing agent'}, msgs:[]},
  {id:'lender', sides:['buyer','lender'],  name:{buyer:'Lender', lender:'Buyer'}, msgs:[]},
  {id:'escrow', sides:['broker','lender'], name:{broker:'Escrow officer', lender:'Escrow officer'}, msgs:[]},
];
let openThread = 'agent', msgSeq = 0;   // msgSeq orders messages across threads (newest = highest)
window.pickThread = id=>{ openThread=id; render(); };
window.sendMsg = ()=>{
  const el=$('#msg-in'), text=el && el.value.trim(); if(!text) return;
  THREADS.find(t=>t.id===openThread).msgs.push({from:VIEWERS[view].role, text, at:++msgSeq});
  render();
};

// The AI coordinator's messages are worked out from the live deal every time, so they never go stale.
function agentMsgs(v){
  const docs = visibleDocs(v), p = intakeProgress();
  if(!INTAKE.log.length) return [`No forms started yet. Answer the questions in the chat and I'll post updates
    here as each form is ready.`];
  const out = [];
  const ready = docs.filter(d=>docState(d).status==='ready');
  const open  = docs.filter(d=>docState(d).status!=='ready');
  out.push(`Progress: <b>${p.answered} of ${p.total}</b> questions answered · <b>${ready.length} of ${docs.length}</b> of your documents ready.`);
  if(ready.length) out.push(`✓ Ready to review and sign:<div class="msg-docs">${ready.map(d=>
    `<button class="doclink" onclick="openDoc('${d.code}')">${d.code}</button>`).join('')}</div>`);
  const gaps = missingFields();
  if(gaps.length) out.push(`⚠ Still missing: <b>${gaps.map(g=>esc(FIELDS[g]||g)).join(', ')}</b>.
    These can't be filled from the chat — someone needs to supply them.`);
  if(open.length && nextQ()) out.push(`${open.length} document(s) are still waiting on answers. Next question in the
    chat: “${nextQ().q}”`);
  return out;
}

function messagesCol(v){
  const threads = THREADS.filter(t=>t.sides.includes(v.role));
  if(!threads.find(t=>t.id===openThread)) openThread = threads[0].id;
  const t = threads.find(x=>x.id===openThread);
  const tabs = threads.map(x=>`<button class="choice ${x.id===openThread?'on':''}" onclick="pickThread('${x.id}')">
    ${x.name[v.role]}${x.msgs.length?` <span class="doccode">${x.msgs.length}</span>`:''}</button>`).join('');
  const bubbles = t.id==='agent'
    ? agentMsgs(v).map(m=>`<div class="msg bot">${m}</div>`).join('')
    : (t.msgs.length ? t.msgs.map(m=> m.from===v.role
        ? `<div class="msg me">${esc(m.text)}</div>`
        : `<div class="msg bot"><div class="doccode">${t.name[v.role]}</div>${esc(m.text)}</div>`).join('')
      : `<div class="note" style="text-align:center">No messages with ${t.name[v.role]} yet.</div>`);
  const reply = t.id==='agent'
    ? `<div class="note">The AI coordinator posts updates automatically — answer it in the chat.</div>`
    : `<div class="fillbox composer"><input id="msg-in" placeholder="Message ${t.name[v.role]}…"
         onkeydown="if(event.key==='Enter')sendMsg()"><button class="act" onclick="sendMsg()">Send</button></div>`;
  return `<section class="col">
    <div class="scroll" id="chatScroll">
      <button class="ghost" onclick="setCenter('chat')" style="margin-bottom:14px">← Back to chat</button>
      <div class="thread"><h2 style="margin:0">Messages</h2><div class="choices" style="margin:0 0 6px">${tabs}</div>${bubbles}</div>
    </div>
    <div class="foot">${reply}</div>
  </section>`;
}

/* ---------- Dashboard screen ---------- */
function dashboardView(v){

  const docs = visibleDocs(v);
  const ready   = docs.filter(d=>docState(d).status==='ready');
  const waiting = docs.filter(d=>docState(d).status!=='ready');
  const gaps = (v.role==='broker'||v.role==='seller') ? missingFields() : [];   // the gaps are in the seller's forms
  const threads = THREADS.filter(t=>t.sides.includes(v.role));
  const recent = threads.flatMap(t=>t.msgs.map(m=>({t,m}))).sort((a,b)=>b.m.at-a.m.at).slice(0,4);

  const attention = [
    q ? `<div class="kv"><span>Next question: <b style="color:var(--ink)">${q.q}</b></span>
          <button class="ghost" onclick="goShell('chat')">Answer</button></div>` : '',
    gaps.length ? `<div class="kv"><span>⚠ Missing: ${gaps.map(g=>esc(FIELDS[g]||g)).join(', ')}</span></div>` : '',
    ...waiting.slice(0,6).map(d=>`<div class="kv"><span><span class="doccode">${d.code}</span> ${d.name}</span>
          <button class="ghost" onclick="openDoc('${d.code}')">View</button></div>`),
  ].filter(Boolean).join('');

  return `<div class="dash-hd">
      <div><h2 class="dash-title">Dashboard</h2>
        <div class="lede" style="margin:0">Viewing as <b>${VIEWERS[v.role].label}</b> ·

    </div>

      <div class="metric"><b>${ready.length}/${docs.length}</b><span>Your documents ready</span></div>
      <div class="metric"><b>${threads.reduce((n,t)=>n+t.msgs.length,0)}</b><span>Messages in your threads</span></div>
    </div>
    <div class="dashgrid">
      <div class="card"><h2>Status</h2>${progressBar(stages, idx)}
        <button class="ghost" onclick="goShell('workflow')" style="margin-top:12px">View detailed workflow →</button></div>
      <div class="card"><h2>Needs attention</h2>
        ${attention || '<p class="lede" style="margin:0">Nothing waiting — every document you can see is ready.</p>'}</div>
      <div class="card"><h2>Recent messages</h2>
        ${recent.length ? recent.map(({t,m})=>`<div class="kv"><span><b style="color:var(--ink)">${
            m.from===v.role ? 'You → '+t.name[v.role] : t.name[v.role]}</b> ${esc(m.text)}</span></div>`).join('')
          : '<p class="lede" style="margin:0">No messages yet.</p>'}
        <button class="ghost" onclick="goShell('messages')" style="margin-top:12px">Open messages →</button></div>
      <div class="card"><h2>Documents</h2>

            `<button class="doclink" onclick="openDoc('${d.code}')">${d.code}</button>`).join('')}</div>`
          : '<p class="lede" style="margin:0">No documents ready yet.</p>'}
        <p class="note">${ready.length} ready · ${waiting.length} still waiting on answers.</p></div>
    </div>
    ${transactionsView(v)}`;

function render(){
  if(SHELL_VIEWS.includes(view)) role = view;   // keep the switcher in step when other code changes the view
  if(DEMO_ROLES.includes(role) && CHAT.role!==role) switchChatRole(role);   // new role: new session, empty panel
  renderRoles();
  if(view==='dashboard'){ $('#app').className=''; $('#app').innerHTML = dashboardView(VIEWERS[role]); return; }
  const shell = SHELL_VIEWS.includes(view) && !RUN.playing;
  $('#app').className = shell ? 'shell' : '';
  if(shell){
    const v = VIEWERS[view];
    $('#app').innerHTML = sidebarCol() + centerCol(v) + railCol(v);
    renderChat();
    const inp = $('#chat-in'); if(inp && !inp.disabled) inp.focus();
    return;
  }
  const v=VIEWERS[view];
  // While the runner is actually playing it takes over the screen: the step log on top,
  // and underneath it the live view the runner just drove the app to. Once it stops,
  // every tab behaves normally again.
  if(RUN.playing && view!=='lab'){
    const live = view==='agent' ? agentView()
               : view==='broker'? brokerView(VIEWERS.broker)
               : view==='seller'? sellerView(VIEWERS.seller)
               : view==='buyer' ? buyerView(VIEWERS.buyer)
               : view==='files' ? filesView() : '';
    $('#app').innerHTML = labView() +
      (live? `<div class="card"><h2>Live view — ${esc(view)}
         <span class="sub">the runner drove the app to this screen</span></h2>${live}</div>`:'');
    const nr=$('#narr'); if(nr&&nr.scrollHeight) nr.scrollTop=nr.scrollHeight;
    return;
  }
  $('#app').innerHTML =
    view==='lab'   ?labView():
    view==='agent' ?agentView():
    view==='broker'?brokerView(v):
    view==='seller'?sellerView(v):
    view==='buyer' ?buyerView(v):
    view==='files' ?filesView():
    view==='eval'  ?evalView():auditView();
}
render();
</script>
</body>
</html>
